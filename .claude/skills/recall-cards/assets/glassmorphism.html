<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recall Cards</title>
<style>
  :root{
    --glass:rgba(255,255,255,0.12); --glass-strong:rgba(255,255,255,0.2);
    --border:rgba(255,255,255,0.25); --text:#F4F6FF; --dim:rgba(244,246,255,.72);
    --ok:#7BE8A8; --bad:#FF8B9E; --accent:#9BB5FF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{min-height:100vh; color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    line-height:1.68; padding:48px 20px;
    background:linear-gradient(135deg,#1a1f4b 0%,#4a2a7a 45%,#146a8f 100%);
    background-attachment:fixed;}
  body::before, body::after{content:""; position:fixed; border-radius:50%;
    filter:blur(90px); opacity:.5; z-index:0; pointer-events:none;}
  body::before{width:420px; height:420px; background:#7b5cff; top:-120px; right:-100px;}
  body::after{width:380px; height:380px; background:#19b8c9; bottom:-140px; left:-120px;}
  .wrap{max-width:720px; margin:0 auto; position:relative; z-index:1;}
  code{font-family:ui-monospace,Consolas,"D2Coding",monospace; font-size:.9em;
    background:rgba(255,255,255,.14); border:1px solid var(--border);
    border-radius:6px; padding:1px 6px;}
  header{background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--border); border-radius:20px; padding:28px 30px; margin-bottom:24px;}
  .eyebrow{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); font-weight:700;}
  h1{font-size:clamp(26px,5vw,36px); font-weight:800; margin-top:8px; letter-spacing:-.01em;}
  .meta{color:var(--dim); font-size:13px; margin-top:6px;}
  .theme{background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--border); border-radius:20px; padding:24px 28px; margin-bottom:20px;}
  .theme h2{font-size:18px; font-weight:800; margin-bottom:16px;
    border-bottom:1px solid var(--border); padding-bottom:10px;}
  .prose p{font-size:14.5px; color:var(--dim); margin-bottom:14px; line-height:1.75;}
  .prose p:last-child{margin-bottom:0;}
  .prose b{font-weight:700; color:var(--text);}
  .sec-label{font-size:12px; letter-spacing:.2em; text-transform:uppercase; font-weight:700;
    color:var(--accent); margin:0 4px 14px;}
  .qcard{background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--border); border-radius:20px; padding:22px; margin-bottom:20px;}
  .qcard-head{margin-bottom:12px;}
  .q-num{display:inline-block; font-size:11px; font-weight:700; letter-spacing:.16em;
    color:#1a1f4b; background:var(--accent); border-radius:999px; padding:4px 12px;}
  .qcard h2{font-size:16.5px; font-weight:700; margin-bottom:14px; border:none; padding:0;}
  .opts{display:grid; gap:10px;}
  .opt{display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%;
    background:var(--glass); border:1px solid var(--border); border-radius:14px;
    padding:11px 14px; font:inherit; font-size:14.5px; color:var(--text);
    cursor:pointer; transition:background .15s, transform .15s;}
  .opt:hover{background:var(--glass-strong); transform:translateY(-1px);}
  .opt .key{font-weight:800; font-size:12px; color:var(--accent); padding-top:2px; flex-shrink:0;}
  .opt.correct{background:rgba(123,232,168,.18); border-color:var(--ok); box-shadow:0 0 0 1px var(--ok);}
  .opt.correct .key{color:var(--ok);}
  .opt.wrong{background:rgba(255,139,158,.16); border-color:var(--bad); box-shadow:0 0 0 1px var(--bad);}
  .opt.wrong .key{color:var(--bad);}
  .qcard.answered .opt{cursor:default;}
  .qcard.answered .opt:hover{transform:none;}
  .expl{display:none; margin-top:14px; padding:13px 16px; border-radius:14px;
    background:rgba(155,181,255,.12); border:1px solid rgba(155,181,255,.3); font-size:14px;}
  .expl.show{display:block;}
  .expl b{display:block; font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent); margin-bottom:5px;}
  footer{background:var(--glass); backdrop-filter:blur(16px); border:1px solid var(--border);
    border-radius:20px; margin-top:30px; padding:18px 24px;
    display:flex; justify-content:space-between; font-weight:800; font-size:15px;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Session Recall</div>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
  </header>
  <main id="sections"></main>
  <section>
    <div class="sec-label">퀴즈 — 기억을 꺼내보기</div>
    <div id="quiz"></div>
  </section>
  <footer><span>SCORE</span><span id="score">0 / 0</span></footer>
</div>
<script>
const DATA = /*__DATA__*/null;
const $ = id => document.getElementById(id);
let score = 0;
$('title').innerHTML = DATA.title;
$('meta').innerHTML = DATA.date || '';
$('sections').innerHTML = DATA.sections.map(sec=>`
  <article class="theme">
    <h2>${sec.title}</h2>
    <div class="prose">${sec.body}</div>
  </article>`).join('');
$('quiz').innerHTML = DATA.quiz.map((q,qi)=>`
  <div class="qcard" data-q="${qi}">
    <div class="qcard-head"><span class="q-num">Q${String(qi+1).padStart(2,'0')}</span></div>
    <h2>${q.q}</h2>
    <div class="opts">${q.options.map((o,oi)=>`
      <button class="opt" data-o="${oi}"><span class="key">${'ABCDE'[oi]}</span><span>${o}</span></button>`).join('')}
    </div>
    <div class="expl"><b>왜?</b>${q.explanation}</div>
  </div>`).join('');
$('score').textContent = `0 / ${DATA.quiz.length}`;
document.querySelectorAll('.qcard').forEach(card=>{
  const qi = +card.dataset.q;
  card.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(card.classList.contains('answered')) return;
      card.classList.add('answered');
      const pick = +btn.dataset.o, ans = DATA.quiz[qi].answer;
      card.querySelectorAll('.opt')[ans].classList.add('correct');
      if(pick!==ans) btn.classList.add('wrong'); else score++;
      card.querySelector('.expl').classList.add('show');
      $('score').textContent = `${score} / ${DATA.quiz.length}`;
    });
  });
});
</script>
</body>
</html>
