<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recall Cards</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<style>
  :root{
    --bg:#FFF8E7; --ink:#141414; --card:#FFFFFF;
    --yellow:#FFD93D; --blue:#4D96FF; --pink:#FF6B9D;
    --ok:#6BCB77; --bad:#FF6B6B; --shadow:6px 6px 0 var(--ink);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    line-height:1.65; padding:44px 20px;
    background-image:radial-gradient(#e8ddc2 1.4px, transparent 1.4px); background-size:22px 22px;}
  .wrap{max-width:740px; margin:0 auto;}
  code{font-family:ui-monospace,Consolas,"D2Coding",monospace; font-size:.9em;
    background:var(--yellow); border:2px solid var(--ink); padding:0 5px;}
  header{background:var(--yellow); border:3px solid var(--ink); box-shadow:var(--shadow);
    padding:24px 26px; margin-bottom:28px; transform:rotate(-.6deg);}
  .eyebrow{display:inline-block; background:var(--ink); color:var(--yellow);
    font-size:11px; font-weight:800; letter-spacing:.14em; padding:4px 10px; margin-bottom:10px;}
  h1{font-size:clamp(26px,5vw,38px); font-weight:900; letter-spacing:-.02em;}
  .meta{font-size:13px; font-weight:700; margin-top:6px;}
  .theme{background:var(--card); border:3px solid var(--ink); box-shadow:var(--shadow);
    padding:22px 24px; margin-bottom:24px;}
  .theme h2{font-size:19px; font-weight:900; background:var(--blue); color:#fff;
    border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink);
    padding:4px 14px; display:inline-block; margin-bottom:16px;}
  .prose p{font-size:14.5px; margin-bottom:13px; line-height:1.72;}
  .prose p:last-child{margin-bottom:0;}
  .prose b{font-weight:900;}
  .sec-label{display:inline-block; background:var(--blue); color:#fff; border:3px solid var(--ink);
    box-shadow:4px 4px 0 var(--ink); font-weight:900; font-size:14px;
    padding:6px 14px; margin-bottom:18px;}
  .qcard{background:var(--card); border:3px solid var(--ink); box-shadow:var(--shadow);
    padding:20px; margin-bottom:24px;}
  .qcard-head{margin-bottom:10px;}
  .q-num{display:inline-block; background:var(--pink); color:#fff; border:2px solid var(--ink);
    font-size:12px; font-weight:900; padding:3px 10px;}
  .qcard h2{font-size:17px; font-weight:900; margin-bottom:14px;}
  .opts{display:grid; gap:10px;}
  .opt{display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%;
    background:#fff; border:3px solid var(--ink); padding:11px 13px; font:inherit;
    font-size:14.5px; font-weight:600; cursor:pointer;
    box-shadow:3px 3px 0 var(--ink); transition:transform .08s, box-shadow .08s;}
  .opt:hover{transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--ink);}
  .opt:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
  .opt .key{background:var(--ink); color:#fff; font-size:11px; font-weight:900;
    padding:2px 7px; flex-shrink:0; margin-top:2px;}
  .opt.correct{background:var(--ok);}
  .opt.wrong{background:var(--bad); color:#fff;}
  .opt.wrong .key{background:#fff; color:var(--ink);}
  .opt.wrong code{background:#fff;}
  .qcard.answered .opt{cursor:default; transform:none;}
  .expl{display:none; margin-top:14px; background:var(--yellow);
    border:3px solid var(--ink); padding:12px 14px; font-size:14px;}
  .expl.show{display:block;}
  .expl b{display:block; font-weight:900; margin-bottom:4px;}
  .expl code{background:#fff;}
  footer{background:var(--ink); color:#fff; border:3px solid var(--ink);
    box-shadow:6px 6px 0 var(--blue); padding:16px 20px; margin-top:32px;
    display:flex; justify-content:space-between; font-weight:900; font-size:16px;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}

  /* New Styles */
  .callout { margin: 16px 0; padding: 14px 16px; border-radius: 0; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); background: var(--yellow); }
  .callout-icon { margin-right: 8px; }
  .callout-label { font-weight: 900; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; display: block; margin-bottom: 6px; }
  .callout-body { font-size: 14.5px; font-weight: 600; }
  .callout-body p { margin-bottom: 8px; }
  .callout-body p:last-child { margin-bottom: 0; }
  
  .diagram-wrap { margin: 20px 0; text-align: center; }
  .diagram-src { text-align: left; font-size: 13px; padding: 14px; overflow-x: auto; white-space: pre; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); background: #fff; }
  .diagram-cap { font-size: 13.5px; font-weight: 700; margin-top: 8px; }
  .mermaid { padding: 16px; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); background: #fff; }
  .mermaid svg { max-width: 100%; height: auto; }
  
  .code-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
  @media (max-width: 600px) { .code-compare { grid-template-columns: 1fr; } }
  .code-panel { border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); background: #fff; }
  .code-panel pre { padding: 14px; font-size: 13px; overflow-x: auto; margin: 0; }
  .code-panel code { background: none; border: none; padding: 0; font-size: inherit; }
  .code-label { font-size: 12px; font-weight: 900; padding: 6px 12px; border-bottom: 3px solid var(--ink); background: var(--pink); color: #fff; }
  
  .analogy-card { margin: 20px 0; padding: 16px 18px; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); background: var(--blue); color: #fff; }
  .analogy-icon { margin-right: 6px; }
  .analogy-label { font-weight: 900; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; display: block; margin-bottom: 6px; }
  .analogy-body { font-size: 14.5px; font-weight: 600; }
  .analogy-body p { margin-bottom: 8px; }
  .analogy-body p:last-child { margin-bottom: 0; }
  
  .q-diff { font-size: 11px; font-weight: 900; letter-spacing: .1em; float: right; padding: 2px 8px; border: 2px solid var(--ink); border-radius: 999px; background: #fff; color: var(--ink); }
  .q-diff-1 { color: var(--ok); }
  .q-diff-2 { color: #FF9F29; }
  .q-diff-3 { color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Session Recall</div>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
  </header>
  <main id="sections"></main>
  <section>
    <div class="sec-label">퀴즈 — 기억을 꺼내보기</div>
    <div id="quiz"></div>
  </section>
  <footer><span>SCORE</span><span id="score">0 / 0</span></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const DATA = /*__DATA__*/null;
const $ = id => document.getElementById(id);
let score = 0;
$('title').innerHTML = DATA.title;
$('meta').innerHTML = DATA.date || '';
$('sections').innerHTML = DATA.sections.map(sec=>{
  let extras = '';
  // diagram
  if(sec.diagram){
    const hasMermaid = typeof mermaid !== 'undefined';
    extras += `<div class="diagram-wrap">`;
    if(hasMermaid){
      extras += `<div class="mermaid">${sec.diagram.code}</div>`;
    } else {
      extras += `<pre class="diagram-src">${sec.diagram.code}</pre>`;
    }
    if(sec.diagram.caption) extras += `<div class="diagram-cap">${sec.diagram.caption}</div>`;
    extras += `</div>`;
  }
  // codeCompare
  if(sec.codeCompare){
    const c = sec.codeCompare;
    const langB = c.before.lang ? ` class="language-${c.before.lang}"` : '';
    const langA = c.after.lang ? ` class="language-${c.after.lang}"` : '';
    extras += `<div class="code-compare">
      <div class="code-panel code-before"><div class="code-label">✗ ${c.before.label}</div><pre><code${langB}>${c.before.code}</code></pre></div>
      <div class="code-panel code-after"><div class="code-label">✓ ${c.after.label}</div><pre><code${langA}>${c.after.code}</code></pre></div>
    </div>`;
  }
  // analogy
  if(sec.analogy){
    extras += `<div class="analogy-card"><span class="analogy-icon">🔗</span><span class="analogy-label">일상으로</span><div class="analogy-body">${sec.analogy}</div></div>`;
  }
  return `<article class="theme"><h2>${sec.title}</h2><div class="prose">${sec.body}</div>${extras}</article>`;
}).join('');
$('quiz').innerHTML = DATA.quiz.map((q,qi)=>{
  const diff = q.difficulty;
  const diffHtml = diff ? `<span class="q-diff q-diff-${diff}">${'●'.repeat(diff)}${'○'.repeat(3-diff)} ${['','EASY','MEDIUM','HARD'][diff]}</span>` : '';
  return `<div class="qcard" data-q="${qi}">
    <div class="qcard-head"><span class="q-num">Q${String(qi+1).padStart(2,'0')}</span>${diffHtml}</div>
    <h2>${q.q}</h2>
    <div class="opts">${q.options.map((o,oi)=>`
      <button class="opt" data-o="${oi}"><span class="key">${'ABCDE'[oi]}</span><span>${o}</span></button>`).join('')}
    </div>
    <div class="expl"><b>왜?</b>${q.explanation}</div>
  </div>`;
}).join('');
if(typeof mermaid !== 'undefined'){
  mermaid.initialize({startOnLoad:false, theme:'default', securityLevel:'loose'});
  mermaid.run({querySelector:'.mermaid'});
}
if(typeof hljs !== 'undefined'){
  hljs.highlightAll();
}
$('score').textContent = `0 / ${DATA.quiz.length}`;
document.querySelectorAll('.qcard').forEach(card=>{
  const qi = +card.dataset.q;
  card.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(card.classList.contains('answered')) return;
      card.classList.add('answered');
      const pick = +btn.dataset.o, ans = DATA.quiz[qi].answer;
      card.querySelectorAll('.opt')[ans].classList.add('correct');
      if(pick!==ans) btn.classList.add('wrong'); else score++;
      card.querySelector('.expl').classList.add('show');
      $('score').textContent = `${score} / ${DATA.quiz.length}`;
    });
  });
});
</script>
</body>
</html>
