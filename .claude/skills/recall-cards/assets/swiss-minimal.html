<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recall Cards</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<style>
  :root{
    --ink:#111111; --paper:#FAFAF7; --line:#111111; --soft:#d5d5cf;
    --accent:#C8102E; --muted:#6b6b66; --ok:#1a7a3c; --bad:#C8102E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink);
    font-family:"Helvetica Neue", Helvetica, Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height:1.65; padding:48px 20px;}
  .wrap{max-width:760px; margin:0 auto;}
  code{font-family:ui-monospace,Consolas,"D2Coding",monospace; font-size:.92em;
    background:#efefe8; border:1px solid #e0e0d8; padding:1px 5px;}
  header{border-bottom:3px solid var(--line); padding-bottom:20px; margin-bottom:32px;}
  .eyebrow{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); font-weight:700;}
  h1{font-size:clamp(28px,5vw,40px); font-weight:700; letter-spacing:-0.02em; margin-top:8px;}
  .meta{color:var(--muted); font-size:13px; margin-top:6px;}
  .theme{margin-bottom:44px;}
  .theme h2{font-size:20px; font-weight:700; letter-spacing:-.01em;
    border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:18px;}
  .prose p{font-size:15px; color:#333; margin-bottom:14px; line-height:1.72;}
  .prose p:last-child{margin-bottom:0;}
  .prose b{font-weight:700;}
  .sec-label{font-size:12px; letter-spacing:.18em; text-transform:uppercase; font-weight:700;
    border-bottom:1px solid var(--line); padding-bottom:6px; margin-bottom:18px;}
  .qcard{border:1px solid var(--line); margin-bottom:22px; background:#fff;}
  .qcard-head{padding:12px 18px; border-bottom:1px solid var(--line);}
  .q-num{font-size:12px; font-weight:700; letter-spacing:.12em; color:var(--accent);}
  .qcard h2{font-size:16.5px; font-weight:700; padding:16px 18px 6px; border:none; margin:0;}
  .opts{padding:8px 18px 18px; display:grid; gap:8px;}
  .opt{display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%;
    background:none; border:1px solid var(--soft); padding:10px 12px; font:inherit;
    font-size:14.5px; cursor:pointer; transition:border-color .15s;}
  .opt:hover{border-color:var(--ink);}
  .opt .key{font-weight:700; font-size:12px; padding-top:2px;}
  .opt.correct{border:2px solid var(--ok); background:#f2faf4;}
  .opt.wrong{border:2px solid var(--bad); background:#fdf2f3;}
  .qcard.answered .opt{cursor:default; opacity:.85;}
  .qcard.answered .opt.correct, .qcard.answered .opt.wrong{opacity:1;}
  .expl{display:none; margin:0 18px 18px; padding:12px 14px;
    border-left:3px solid var(--accent); background:#f4f4ef; font-size:14px;}
  .expl.show{display:block;}
  .expl b{display:block; font-size:11px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:4px;}
  footer{border-top:3px solid var(--line); margin-top:36px; padding-top:16px;
    display:flex; justify-content:space-between; font-size:14px; font-weight:700;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}

  /* New Styles */
  .callout { margin: 16px 0; padding: 14px 16px; border-radius: 4px; border-left: 3px solid var(--accent); background: #f4f4ef; }
  .callout-icon { margin-right: 8px; }
  .callout-label { font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; display: block; margin-bottom: 6px; color: var(--accent); }
  .callout-body { font-size: 14px; }
  .callout-body p { margin-bottom: 8px; }
  .callout-body p:last-child { margin-bottom: 0; }
  
  .diagram-wrap { margin: 20px 0; text-align: center; }
  .diagram-src { text-align: left; font-size: 13px; padding: 14px; overflow-x: auto; white-space: pre; background: #efefe8; }
  .diagram-cap { font-size: 13px; margin-top: 8px; opacity: 0.7; }
  .mermaid { padding: 16px; }
  .mermaid svg { max-width: 100%; height: auto; }
  
  .code-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
  @media (max-width: 600px) { .code-compare { grid-template-columns: 1fr; } }
  .code-panel pre { padding: 14px; font-size: 13px; overflow-x: auto; margin: 0; background: #efefe8; }
  .code-panel code { background: none; border: none; padding: 0; font-size: inherit; }
  .code-label { font-size: 12px; font-weight: 700; padding: 6px 12px; border-bottom: 1px solid var(--soft); background: #f4f4ef; }
  
  .analogy-card { margin: 20px 0; padding: 16px 18px; border-radius: 4px; border: 1px solid var(--line); background: #fff; }
  .analogy-icon { margin-right: 6px; }
  .analogy-label { font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; display: block; margin-bottom: 6px; }
  .analogy-body { font-size: 14px; }
  .analogy-body p { margin-bottom: 8px; }
  .analogy-body p:last-child { margin-bottom: 0; }
  
  .q-diff { font-size: 11px; font-weight: 700; letter-spacing: .1em; float: right; }
  .q-diff-1 { color: var(--ok); }
  .q-diff-2 { color: #f59e0b; }
  .q-diff-3 { color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Session Recall</div>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
  </header>
  <main id="sections"></main>
  <section>
    <div class="sec-label">퀴즈 — 기억을 꺼내보기</div>
    <div id="quiz"></div>
  </section>
  <footer><span>SCORE</span><span id="score">0 / 0</span></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const DATA = /*__DATA__*/null;
const $ = id => document.getElementById(id);
let score = 0;
$('title').innerHTML = DATA.title;
$('meta').innerHTML = DATA.date || '';
$('sections').innerHTML = DATA.sections.map(sec=>{
  let extras = '';
  // diagram
  if(sec.diagram){
    const hasMermaid = typeof mermaid !== 'undefined';
    extras += `<div class="diagram-wrap">`;
    if(hasMermaid){
      extras += `<div class="mermaid">${sec.diagram.code}</div>`;
    } else {
      extras += `<pre class="diagram-src">${sec.diagram.code}</pre>`;
    }
    if(sec.diagram.caption) extras += `<div class="diagram-cap">${sec.diagram.caption}</div>`;
    extras += `</div>`;
  }
  // codeCompare
  if(sec.codeCompare){
    const c = sec.codeCompare;
    const langB = c.before.lang ? ` class="language-${c.before.lang}"` : '';
    const langA = c.after.lang ? ` class="language-${c.after.lang}"` : '';
    extras += `<div class="code-compare">
      <div class="code-panel code-before"><div class="code-label">✗ ${c.before.label}</div><pre><code${langB}>${c.before.code}</code></pre></div>
      <div class="code-panel code-after"><div class="code-label">✓ ${c.after.label}</div><pre><code${langA}>${c.after.code}</code></pre></div>
    </div>`;
  }
  // analogy
  if(sec.analogy){
    extras += `<div class="analogy-card"><span class="analogy-icon">🔗</span><span class="analogy-label">일상으로</span><div class="analogy-body">${sec.analogy}</div></div>`;
  }
  return `<article class="theme"><h2>${sec.title}</h2><div class="prose">${sec.body}</div>${extras}</article>`;
}).join('');
$('quiz').innerHTML = DATA.quiz.map((q,qi)=>{
  const diff = q.difficulty;
  const diffHtml = diff ? `<span class="q-diff q-diff-${diff}">${'●'.repeat(diff)}${'○'.repeat(3-diff)} ${['','EASY','MEDIUM','HARD'][diff]}</span>` : '';
  return `<div class="qcard" data-q="${qi}">
    <div class="qcard-head"><span class="q-num">Q${String(qi+1).padStart(2,'0')}</span>${diffHtml}</div>
    <h2>${q.q}</h2>
    <div class="opts">${q.options.map((o,oi)=>`
      <button class="opt" data-o="${oi}"><span class="key">${'ABCDE'[oi]}</span><span>${o}</span></button>`).join('')}
    </div>
    <div class="expl"><b>왜?</b>${q.explanation}</div>
  </div>`;
}).join('');
if(typeof mermaid !== 'undefined'){
  mermaid.initialize({startOnLoad:false, theme:'default', securityLevel:'loose'});
  mermaid.run({querySelector:'.mermaid'});
}
if(typeof hljs !== 'undefined'){
  hljs.highlightAll();
}
$('score').textContent = `0 / ${DATA.quiz.length}`;
document.querySelectorAll('.qcard').forEach(card=>{
  const qi = +card.dataset.q;
  card.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(card.classList.contains('answered')) return;
      card.classList.add('answered');
      const pick = +btn.dataset.o, ans = DATA.quiz[qi].answer;
      card.querySelectorAll('.opt')[ans].classList.add('correct');
      if(pick!==ans) btn.classList.add('wrong'); else score++;
      card.querySelector('.expl').classList.add('show');
      $('score').textContent = `${score} / ${DATA.quiz.length}`;
    });
  });
});
</script>
</body>
</html>
