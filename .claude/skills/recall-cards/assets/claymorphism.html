<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recall Cards</title>
<style>
  :root{
    --bg:#EFF3FB; --card:#FFFFFF; --ink:#2E3350; --dim:#7A81A3;
    --violet:#8B7CF6; --peach:#FFA98A; --mint:#5ED4B0; --rose:#F98BA6;
    --clay:0 10px 24px rgba(46,51,80,.10), inset 0 -6px 10px rgba(46,51,80,.05), inset 0 4px 8px rgba(255,255,255,.9);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    line-height:1.68; padding:48px 20px;}
  .wrap{max-width:700px; margin:0 auto;}
  code{font-family:ui-monospace,Consolas,"D2Coding",monospace; font-size:.9em;
    background:#EAE6FD; color:#5B4CC4; border-radius:8px; padding:1px 7px;}
  header{background:linear-gradient(135deg,var(--violet),#A99BFF); color:#fff;
    border-radius:28px; padding:28px 30px; margin-bottom:18px;
    box-shadow:0 14px 28px rgba(139,124,246,.35), inset 0 -8px 14px rgba(0,0,0,.12), inset 0 4px 8px rgba(255,255,255,.35);}
  .eyebrow{display:inline-block; background:rgba(255,255,255,.25); border-radius:999px;
    font-size:11px; font-weight:800; letter-spacing:.14em; padding:5px 14px; margin-bottom:12px;}
  h1{font-size:clamp(25px,5vw,34px); font-weight:800; letter-spacing:-.01em;}
  .meta{font-size:13px; opacity:.85; margin-top:6px;}
  .stats{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:36px;}
  .stats:empty{display:none; margin:0;}
  .stat{flex:1 1 120px; background:var(--card); border-radius:20px; box-shadow:var(--clay);
    padding:12px 16px; text-align:center;}
  .stat .v{font-size:22px; font-weight:800; color:var(--violet);}
  .stat .l{font-size:11.5px; font-weight:700; color:var(--dim);}
  .theme{margin-bottom:38px;}
  .theme-head{display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; margin:0 8px 14px;}
  .theme-no{width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg,var(--violet),#A99BFF); color:#fff;
    display:grid; place-items:center; font-size:13px; font-weight:800; align-self:center;
    box-shadow:0 6px 12px rgba(139,124,246,.4);}
  .theme-no:empty{display:none;}
  .theme-head h2{font-size:18px; font-weight:800;}
  .theme-head .sub{font-size:12.5px; color:var(--dim); margin-left:auto;}
  .kcard{background:var(--card); border-radius:22px; box-shadow:var(--clay);
    padding:18px 21px; margin-bottom:14px;}
  .kcard .tag{display:inline-block; background:linear-gradient(135deg,var(--peach),#FFC3AD);
    color:#fff; border-radius:999px; font-size:11px; font-weight:800; padding:3px 12px;
    margin-bottom:8px; box-shadow:0 5px 10px rgba(255,169,138,.35);}
  .kcard .tag:empty{display:none;}
  .kcard h3{font-size:15.5px; font-weight:800; margin-bottom:4px;}
  .kcard .body{font-size:14px; color:#4b5170;}
  .kcard .rule{font-size:13.5px; color:#4b5170; margin-top:9px; background:#F2EFFE;
    border-radius:14px; padding:8px 13px; box-shadow:inset 0 3px 6px rgba(139,124,246,.12);}
  .kcard .rule b{color:var(--violet); font-weight:800;}
  .sec-label{font-size:13px; font-weight:800; color:var(--dim); letter-spacing:.1em;
    text-transform:uppercase; margin:0 8px 14px;}
  .qcard{background:var(--card); border-radius:26px; box-shadow:var(--clay);
    padding:24px; margin-bottom:22px;}
  .qcard-head{margin-bottom:10px;}
  .q-num{display:inline-block; background:linear-gradient(135deg,var(--peach),#FFC3AD);
    color:#fff; border-radius:999px; font-size:12px; font-weight:800; padding:5px 14px;
    box-shadow:0 6px 12px rgba(255,169,138,.4), inset 0 -3px 5px rgba(0,0,0,.1);}
  .qcard h2{font-size:16.5px; font-weight:800; margin-bottom:15px;}
  .opts{display:grid; gap:11px;}
  .opt{display:flex; gap:11px; align-items:flex-start; text-align:left; width:100%;
    background:#F5F7FD; border:none; border-radius:18px; padding:13px 15px;
    font:inherit; font-size:14.5px; font-weight:600; color:var(--ink); cursor:pointer;
    box-shadow:0 4px 10px rgba(46,51,80,.07), inset 0 2px 4px rgba(255,255,255,.9);
    transition:transform .12s, box-shadow .12s;}
  .opt:hover{transform:translateY(-2px); box-shadow:0 8px 16px rgba(46,51,80,.12), inset 0 2px 4px rgba(255,255,255,.9);}
  .opt:active{transform:translateY(1px);}
  .opt .key{width:26px; height:26px; border-radius:50%; background:#fff; flex-shrink:0;
    display:grid; place-items:center; font-size:12px; font-weight:800; color:var(--violet);
    box-shadow:0 3px 6px rgba(46,51,80,.12);}
  .opt.correct{background:linear-gradient(135deg,#DFF7EE,#C9F2E2);
    box-shadow:0 6px 14px rgba(94,212,176,.35), inset 0 -3px 6px rgba(94,212,176,.2);}
  .opt.correct .key{background:var(--mint); color:#fff;}
  .opt.wrong{background:linear-gradient(135deg,#FDE4EA,#FBD3DE);
    box-shadow:0 6px 14px rgba(249,139,166,.35), inset 0 -3px 6px rgba(249,139,166,.2);}
  .opt.wrong .key{background:var(--rose); color:#fff;}
  .qcard.answered .opt{cursor:default; transform:none;}
  .expl{display:none; margin-top:15px; background:#F2EFFE; border-radius:18px;
    padding:14px 17px; font-size:14px; color:#4b5170;
    box-shadow:inset 0 3px 6px rgba(139,124,246,.12);}
  .expl.show{display:block;}
  .expl b{display:block; color:var(--violet); font-weight:800; margin-bottom:4px;}
  footer{background:var(--card); border-radius:24px; box-shadow:var(--clay);
    padding:18px 26px; margin-top:32px; display:flex; justify-content:space-between;
    font-weight:800; font-size:16px;}
  #score{color:var(--violet);}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Session Recall</div>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="stats" id="stats"></div>
  <main id="sections"></main>
  <section>
    <div class="sec-label">퀴즈 — 기억을 꺼내보기</div>
    <div id="quiz"></div>
  </section>
  <footer><span>SCORE</span><span id="score">0 / 0</span></footer>
</div>
<script>
const DATA = /*__DATA__*/null;
const $ = id => document.getElementById(id);
let score = 0;
$('title').innerHTML = DATA.title;
$('meta').innerHTML = DATA.date || '';
$('stats').innerHTML = (DATA.stats||[]).map(s=>
  `<div class="stat"><div class="v">${s.value}</div><div class="l">${s.label}</div></div>`).join('');
$('sections').innerHTML = DATA.sections.map(sec=>`
  <section class="theme">
    <div class="theme-head">
      ${sec.no?`<span class="theme-no">${sec.no}</span>`:''}
      <h2>${sec.title}</h2>
      ${sec.subtitle?`<span class="sub">${sec.subtitle}</span>`:''}
    </div>
    ${sec.cards.map(c=>`
      <div class="kcard">
        <div class="tag">${c.tag||''}</div>
        <div>
          <h3>${c.heading}</h3>
          <p class="body">${c.body}</p>
          ${c.rule?`<p class="rule"><b>규칙</b> — ${c.rule}</p>`:''}
        </div>
      </div>`).join('')}
  </section>`).join('');
$('quiz').innerHTML = DATA.quiz.map((q,qi)=>`
  <div class="qcard" data-q="${qi}">
    <div class="qcard-head"><span class="q-num">Q${String(qi+1).padStart(2,'0')}</span></div>
    <h2>${q.q}</h2>
    <div class="opts">${q.options.map((o,oi)=>`
      <button class="opt" data-o="${oi}"><span class="key">${'ABCDE'[oi]}</span><span>${o}</span></button>`).join('')}
    </div>
    <div class="expl"><b>왜?</b>${q.explanation}</div>
  </div>`).join('');
$('score').textContent = `0 / ${DATA.quiz.length}`;
document.querySelectorAll('.qcard').forEach(card=>{
  const qi = +card.dataset.q;
  card.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(card.classList.contains('answered')) return;
      card.classList.add('answered');
      const pick = +btn.dataset.o, ans = DATA.quiz[qi].answer;
      card.querySelectorAll('.opt')[ans].classList.add('correct');
      if(pick!==ans) btn.classList.add('wrong'); else score++;
      card.querySelector('.expl').classList.add('show');
      $('score').textContent = `${score} / ${DATA.quiz.length}`;
    });
  });
});
</script>
</body>
</html>
