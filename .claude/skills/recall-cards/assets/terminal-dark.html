<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recall Cards</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
  :root{
    --bg:#0B0E14; --panel:#12161F; --line:#232A38; --text:#D7DEE9; --dim:#7C8797;
    --green:#3DDC84; --amber:#FFB454; --red:#FF6B6B; --cyan:#59C2FF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text);
    font-family:"JetBrains Mono","D2Coding",ui-monospace,Consolas,monospace;
    line-height:1.7; padding:40px 18px; font-size:14px;}
  .wrap{max-width:780px; margin:0 auto;}
  code{color:var(--amber); background:rgba(255,180,84,.08);
    border:1px solid rgba(255,180,84,.25); border-radius:4px; padding:0 5px; font-size:.95em;}
  header{background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:20px 22px; margin-bottom:22px; position:relative;}
  header::before{content:"● ● ●"; display:block; color:#3a4356;
    font-size:11px; letter-spacing:4px; margin-bottom:12px;}
  .eyebrow{color:var(--green); font-size:13px;}
  .eyebrow::before{content:"$ "; }
  h1{font-size:clamp(20px,4vw,26px); font-weight:700; color:var(--cyan); margin:10px 0 4px;}
  .meta{color:var(--dim); font-size:12.5px;}
  .meta::before{content:"# ";}
  .theme{background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:18px 20px; margin-bottom:16px;}
  .theme h2{font-size:16px; font-weight:700; color:var(--cyan); margin-bottom:14px;
    border-bottom:1px solid var(--line); padding-bottom:8px;}
  .prose p{font-size:13.5px; margin-bottom:12px; line-height:1.75;}
  .prose p:last-child{margin-bottom:0;}
  .prose b{font-weight:700; color:var(--amber);}
  .sec-label{color:var(--green); font-weight:700; font-size:14px; margin-bottom:14px;}
  .sec-label::before{content:"$ ";}
  .qcard{background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:18px 20px; margin-bottom:18px;}
  .qcard-head{margin-bottom:8px;}
  .q-num{color:var(--green); font-size:12px; font-weight:700;}
  .qcard h2{font-size:15px; font-weight:700; margin-bottom:14px; border:none; padding:0;}
  .opts{display:grid; gap:8px;}
  .opt{display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%;
    background:transparent; border:1px solid var(--line); border-radius:6px;
    padding:10px 12px; font:inherit; font-size:13.5px; color:var(--text);
    cursor:pointer; transition:border-color .12s, background .12s;}
  .opt:hover{border-color:var(--cyan); background:rgba(89,194,255,.06);}
  .opt .key{color:var(--cyan); flex-shrink:0;}
  .opt .key::before{content:"[";}
  .opt .key::after{content:"]";}
  .opt.correct{border-color:var(--green); background:rgba(61,220,132,.08);}
  .opt.correct .key{color:var(--green);}
  .opt.wrong{border-color:var(--red); background:rgba(255,107,107,.08);}
  .opt.wrong .key{color:var(--red);}
  .qcard.answered .opt{cursor:default;}
  .qcard.answered .opt:not(.correct):not(.wrong):hover{border-color:var(--line); background:transparent;}
  .expl{display:none; margin-top:14px; border:1px dashed var(--line); border-radius:6px;
    padding:12px 14px; font-size:13px; color:var(--dim);}
  .expl.show{display:block;}
  .expl b{color:var(--amber); display:block; margin-bottom:4px;}
  .expl b::before{content:"// ";}
  footer{background:var(--panel); border:1px solid var(--line); border-radius:10px;
    margin-top:26px; padding:16px 20px; display:flex; justify-content:space-between; font-weight:700;}
  #score{color:var(--green);}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}

  /* New Styles */
  .callout { margin: 16px 0; padding: 14px 16px; border-radius: 6px; border: 1px dashed var(--line); background: rgba(255,255,255,0.02); }
  .callout-icon { margin-right: 8px; color: var(--amber); }
  .callout-label { font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; display: block; margin-bottom: 6px; color: var(--amber); }
  .callout-body { font-size: 14px; }
  .callout-body p { margin-bottom: 8px; }
  .callout-body p:last-child { margin-bottom: 0; }
  
  .diagram-wrap { margin: 20px 0; text-align: center; }
  .diagram-src { text-align: left; font-size: 13px; padding: 14px; overflow-x: auto; white-space: pre; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  .diagram-cap { font-size: 13px; margin-top: 8px; opacity: 0.7; }
  .mermaid { padding: 16px; background: var(--bg); border-radius: 6px; border: 1px solid var(--line); }
  .mermaid svg { max-width: 100%; height: auto; }
  
  .code-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
  @media (max-width: 600px) { .code-compare { grid-template-columns: 1fr; } }
  .code-panel pre { padding: 14px; font-size: 13px; overflow-x: auto; margin: 0; background: var(--bg); border-radius: 0 0 6px 6px; border: 1px solid var(--line); border-top: none; }
  .code-panel code { background: none; border: none; padding: 0; font-size: inherit; color: var(--text); }
  .code-label { font-size: 12px; font-weight: 700; padding: 6px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px 6px 0 0; }
  
  .analogy-card { margin: 20px 0; padding: 16px 18px; border-radius: 6px; border: 1px dashed var(--cyan); background: rgba(89,194,255,.04); }
  .analogy-icon { margin-right: 6px; }
  .analogy-label { font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; display: block; margin-bottom: 6px; color: var(--cyan); }
  .analogy-body { font-size: 14px; }
  .analogy-body p { margin-bottom: 8px; }
  .analogy-body p:last-child { margin-bottom: 0; }
  
  .q-diff { font-size: 11px; font-weight: 700; letter-spacing: .1em; float: right; }
  .q-diff-1 { color: var(--green); }
  .q-diff-2 { color: var(--amber); }
  .q-diff-3 { color: var(--red); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Session Recall</div>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
  </header>
  <main id="sections"></main>
  <section>
    <div class="sec-label">퀴즈 — 기억을 꺼내보기</div>
    <div id="quiz"></div>
  </section>
  <footer><span>SCORE</span><span id="score">0 / 0</span></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const DATA = /*__DATA__*/null;
const $ = id => document.getElementById(id);
let score = 0;
$('title').innerHTML = DATA.title;
$('meta').innerHTML = DATA.date || '';
$('sections').innerHTML = DATA.sections.map(sec=>{
  let extras = '';
  // diagram
  if(sec.diagram){
    const hasMermaid = typeof mermaid !== 'undefined';
    extras += `<div class="diagram-wrap">`;
    if(hasMermaid){
      extras += `<div class="mermaid">${sec.diagram.code}</div>`;
    } else {
      extras += `<pre class="diagram-src">${sec.diagram.code}</pre>`;
    }
    if(sec.diagram.caption) extras += `<div class="diagram-cap">${sec.diagram.caption}</div>`;
    extras += `</div>`;
  }
  // codeCompare
  if(sec.codeCompare){
    const c = sec.codeCompare;
    const langB = c.before.lang ? ` class="language-${c.before.lang}"` : '';
    const langA = c.after.lang ? ` class="language-${c.after.lang}"` : '';
    extras += `<div class="code-compare">
      <div class="code-panel code-before"><div class="code-label">✗ ${c.before.label}</div><pre><code${langB}>${c.before.code}</code></pre></div>
      <div class="code-panel code-after"><div class="code-label">✓ ${c.after.label}</div><pre><code${langA}>${c.after.code}</code></pre></div>
    </div>`;
  }
  // analogy
  if(sec.analogy){
    extras += `<div class="analogy-card"><span class="analogy-icon">🔗</span><span class="analogy-label">일상으로</span><div class="analogy-body">${sec.analogy}</div></div>`;
  }
  return `<article class="theme"><h2>${sec.title}</h2><div class="prose">${sec.body}</div>${extras}</article>`;
}).join('');
$('quiz').innerHTML = DATA.quiz.map((q,qi)=>{
  const diff = q.difficulty;
  const diffHtml = diff ? `<span class="q-diff q-diff-${diff}">${'●'.repeat(diff)}${'○'.repeat(3-diff)} ${['','EASY','MEDIUM','HARD'][diff]}</span>` : '';
  return `<div class="qcard" data-q="${qi}">
    <div class="qcard-head"><span class="q-num">Q${String(qi+1).padStart(2,'0')}</span>${diffHtml}</div>
    <h2>${q.q}</h2>
    <div class="opts">${q.options.map((o,oi)=>`
      <button class="opt" data-o="${oi}"><span class="key">${'ABCDE'[oi]}</span><span>${o}</span></button>`).join('')}
    </div>
    <div class="expl"><b>왜?</b>${q.explanation}</div>
  </div>`;
}).join('');
if(typeof mermaid !== 'undefined'){
  mermaid.initialize({startOnLoad:false, theme:'dark', securityLevel:'loose'});
  mermaid.run({querySelector:'.mermaid'});
}
if(typeof hljs !== 'undefined'){
  hljs.highlightAll();
}
$('score').textContent = `0 / ${DATA.quiz.length}`;
document.querySelectorAll('.qcard').forEach(card=>{
  const qi = +card.dataset.q;
  card.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(card.classList.contains('answered')) return;
      card.classList.add('answered');
      const pick = +btn.dataset.o, ans = DATA.quiz[qi].answer;
      card.querySelectorAll('.opt')[ans].classList.add('correct');
      if(pick!==ans) btn.classList.add('wrong'); else score++;
      card.querySelector('.expl').classList.add('show');
      $('score').textContent = `${score} / ${DATA.quiz.length}`;
    });
  });
});
</script>
</body>
</html>
